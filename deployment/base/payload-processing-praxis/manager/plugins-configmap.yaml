apiVersion: v1
kind: ConfigMap
metadata:
  name: payload-processing-plugins
  namespace: openshift-ingress
  # Do NOT set opendatahub.io/managed=false here: PostRender drops any resource that
  # already carries that annotation, which would prevent first-time creation.
  # The tenant reconciler stamps managed=false after bootstrap/migrate so later
  # SSA leaves this ConfigMap alone (see ApplyRendered). Set managed=true on the
  # live ConfigMap to opt back into continuous reconciler management.
data:
  # Stub BBR (pre-auth) Praxis chain. Iterate as Praxis filters land.
  pre-extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      tls:
        mode: self_signed
    filter_chains:
      - name: bbr
        filters:
          - filter: model_to_header
            header: X-Gateway-Model-Name
    insecure_options:
      allow_unbounded_body: true
  # IPP (post-auth) Praxis chain. Iterate as Praxis filters land.
  # llmisvc_model_provider_resolver ports the LLMISvc / KServe BBR body-rewrite
  # branch: when X-Gateway-Model-Name (set by pre model_to_header) is a publisher
  # ID (publishers/.../models/<name>), rewrite body "model" to <name> only.
  # The routing header is left unchanged so KServe can still route on the ID.
  extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      tls:
        mode: self_signed
    filter_chains:
      - name: ipp
        filters:
          - filter: request_id
          - filter: llmisvc_model_provider_resolver
            header: X-Gateway-Model-Name
          # TODO: translation / apikey / ExternalModel provider resolve as Praxis filters land
    insecure_options:
      allow_unbounded_body: true
